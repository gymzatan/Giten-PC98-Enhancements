; Giten Megami Tensei Redux - DOSBox-X on Windows
; Put this file and mapper-giten.map beside dosbox-x.exe.
; Put your final patched image here as Giten_Controls.hdi.
; The PepsimanGB pre-made disk requires its companion boot floppy:
; copy your Giten Megami Tensei Boot FD.fdi here as Boot.fdi.
; Then double-click dosbox-x.exe.
; For an image that already boots on its own, replace BOTH autoexec lines
; with: boot Giten_Controls.hdi

[sdl]
fullscreen = false
windowresolution = 1280x800
output = direct3d
autolock = false
mapperfile = mapper-giten.map

[dosbox]
machine = pc9821
memsize = 16
working directory option = program
quit warning = false

[cpu]
cycles = max

[midi]
mpu401 = none

[sblaster]
sbtype = none

[autoexec]
imgmount 2 "Giten_Controls.hdi" -t hdd -fs none
boot "Boot.fdi" -l a
